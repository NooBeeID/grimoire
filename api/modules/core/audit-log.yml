openapi: 3.1.0
info:
  title: Grimoire Audit Log
  version: 0.2.0
paths:
  /api/audit-log:
    get:
      operationId: listAuditEntries
      tags: [audit-log]
      summary: Daftar entri audit (filter gabungan, cursor keyset)
      description: >
        Khusus super_admin. Urutan selalu occurred_at DESC, id DESC. Detail (args, result, ip,
        user_agent, trace_id) tidak ada di daftar; ambil lewat GET /api/audit-log/{id}.
        Parameter tak dikenal diabaikan. Tidak ada endpoint POST/PUT/PATCH/DELETE (append-only).
      parameters:
        - name: actor_type
          in: query
          schema: { $ref: "#/components/schemas/ActorType" }
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: actor_label
          in: query
          description: Mengandung teks, tidak peka huruf besar-kecil.
          schema: { type: string, maxLength: 200 }
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: Berulang (maks 20), format a.b[.c].
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, example: mcp.read_file }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditStatus" }
        - name: from
          in: query
          description: RFC3339, inklusif.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: RFC3339, eksklusif.
          schema: { type: string, format: date-time }
        - name: target
          in: query
          description: Mengandung teks, tidak peka huruf besar-kecil.
          schema: { type: string, maxLength: 200 }
        - name: cursor
          in: query
          description: Nilai opak dari next_cursor; klien tidak boleh menyusunnya.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Satu halaman entri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryList"
              example:
                items:
                  - id: 0192f0c4-7b00-7d11-8a00-1a2b3c4d5e6f
                    occurred_at: "2026-10-19T08:14:22.123456Z"
                    actor_type: api_key
                    actor_id: 0192f0c4-7a1e-7c3a-9b1d-3c4e5f6a7b8c
                    actor_label: claude-code-budi (gk_ab12)
                    project_id: 0192f0c4-0000-7000-8000-000000000001
                    project_label: Payments
                    action: mcp.read_file
                    target_type: file
                    target: docs/auth/login.md
                    status: ok
                next_cursor: MjAyNi0xMC0xOVQwODoxNDoyMFp8MDE5MmYwYzQtN2FmZi03YzAwLThiMDAtMGYwZTBkMGMwYjBh
        "400":
          description: Filter atau cursor tidak valid (INVALID_ARGUMENT, details.field berisi nama parameter)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error: { code: INVALID_ARGUMENT, message: limit tidak valid, details: { field: limit } }
                trace_id: 4f1c2b7e9a0d4e6f
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
  /api/audit-log/summary:
    get:
      operationId: getAuditSummary
      tags: [audit-log]
      summary: Ringkasan pemakaian tool MCP (agregat)
      description: >
        Khusus super_admin. Rentang [from, to) mundur dari waktu request; bucket trafik dalam UTC
        (24h per jam, 7d/30d per hari). Tool MCP = aksi mcp.* kecuali aksi gateway (initialize,
        tools_list, auth.rejected, rate_limited, unknown_tool). search_quality null bila project_id
        tidak diisi; bila diisi dan kontrak pencarian (T11) gagal, nilainya available=false dengan
        respons tetap 200. Tidak memuat args, result, query, atau path. Pemanggilan tidak dicatat ke audit.
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: ["24h", "7d", "30d"], default: "7d" }
        - name: project_id
          in: query
          description: Kosong berarti semua project.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ringkasan dalam satu respons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSummary"
              example:
                range: 7d
                from: "2026-10-15T10:30:15Z"
                to: "2026-10-22T10:30:15Z"
                bucket: day
                project_id: null
                total_calls: 1234
                total_errors: 31
                error_rate: 0.0251
                top_projects:
                  - { project_id: 0192f5a0-1111-7aaa-8bbb-000000000001, project_label: Payments, calls: 420 }
                tool_usage:
                  - { tool: read_file, calls: 600 }
                tool_metrics:
                  - { tool: read_file, calls: 600, ok: 590, error: 10, error_rate: 0.0167, p50_ms: 8, p95_ms: 40 }
                  - { tool: get_api_endpoint, calls: 82, ok: 77, error: 5, error_rate: 0.061, p50_ms: null, p95_ms: null }
                traffic:
                  - { at: "2026-10-15T00:00:00Z", calls: 90, errors: 2 }
                search_quality: null
        "400":
          description: range atau project_id tidak valid (INVALID_ARGUMENT, details.field berisi nama parameter)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error: { code: INVALID_ARGUMENT, message: range tidak valid, details: { field: range } }
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
  /api/audit-log/{id}:
    get:
      operationId: getAuditEntry
      tags: [audit-log]
      summary: Detail satu entri audit
      description: >
        Khusus super_admin. Id yang bukan uuid kanonis atau tidak ada sama-sama menghasilkan 404
        dengan body identik.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Entri lengkap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryDetail"
              example:
                id: 0192f0c4-7b00-7d11-8a00-1a2b3c4d5e6f
                occurred_at: "2026-10-19T08:14:22.123456Z"
                actor_type: api_key
                actor_id: 0192f0c4-7a1e-7c3a-9b1d-3c4e5f6a7b8c
                actor_label: claude-code-budi (gk_ab12)
                project_id: 0192f0c4-0000-7000-8000-000000000001
                project_label: Payments
                action: mcp.read_file
                target_type: file
                target: docs/auth/login.md
                status: ok
                args: { path: docs/auth/login.md, api_key: "[REDACTED]" }
                result: { bytes: 4812, content: "[OMITTED]" }
                ip: 203.0.113.5
                user_agent: claude-code/2.1
                trace_id: 9c2e41aa07b34f15
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "404": { $ref: "../infra/foundation.yml#/components/responses/NotFound" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
components:
  schemas:
    ActorType:
      type: string
      enum: [user, api_key, anonymous, system]
    AuditStatus:
      type: string
      enum: [ok, error, denied]
    AuditEntrySummary:
      type: object
      required:
        - id
        - occurred_at
        - actor_type
        - actor_id
        - actor_label
        - project_id
        - project_label
        - action
        - target_type
        - target
        - status
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_type: { $ref: "#/components/schemas/ActorType" }
        actor_id: { type: [string, "null"], format: uuid }
        actor_label: { type: string }
        project_id: { type: [string, "null"], format: uuid }
        project_label: { type: [string, "null"] }
        action: { type: string, example: mcp.read_file }
        target_type: { type: [string, "null"] }
        target: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/AuditStatus" }
    AuditEntryList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntrySummary" }
        next_cursor:
          type: [string, "null"]
          description: Null pada halaman terakhir.
    AuditEntryDetail:
      allOf:
        - $ref: "#/components/schemas/AuditEntrySummary"
        - type: object
          required: [args, result, ip, user_agent, trace_id]
          properties:
            args:
              type: object
              additionalProperties: true
              description: Argumen yang sudah disanitasi.
            result:
              type: object
              additionalProperties: true
            ip: { type: [string, "null"] }
            user_agent: { type: [string, "null"] }
            trace_id: { type: [string, "null"] }
    AuditSummary:
      type: object
      additionalProperties: false
      required: [range, from, to, bucket, project_id, total_calls, total_errors, error_rate, top_projects, tool_usage, tool_metrics, traffic, search_quality]
      properties:
        range: { type: string, enum: ["24h", "7d", "30d"] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: Eksklusif. }
        bucket: { type: string, enum: [hour, day] }
        project_id: { type: [string, "null"], format: uuid }
        total_calls: { type: integer, minimum: 0 }
        total_errors: { type: integer, minimum: 0 }
        error_rate: { type: [number, "null"], description: Null bila total_calls 0. }
        top_projects:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/AuditSummaryTopProject" }
        tool_usage:
          type: array
          items: { $ref: "#/components/schemas/AuditSummaryToolUsage" }
        tool_metrics:
          type: array
          items: { $ref: "#/components/schemas/AuditSummaryToolMetric" }
        traffic:
          type: array
          items: { $ref: "#/components/schemas/AuditSummaryTrafficPoint" }
        search_quality:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AuditSummarySearchQuality"
    AuditSummaryTopProject:
      type: object
      additionalProperties: false
      required: [project_id, project_label, calls]
      properties:
        project_id: { type: string, format: uuid }
        project_label: { type: string, description: Label audit terbaru; fallback project_id. }
        calls: { type: integer, minimum: 0 }
    AuditSummaryToolUsage:
      type: object
      additionalProperties: false
      required: [tool, calls]
      properties:
        tool: { type: string, example: read_file }
        calls: { type: integer, minimum: 0 }
    AuditSummaryToolMetric:
      type: object
      additionalProperties: false
      required: [tool, calls, ok, error, error_rate, p50_ms, p95_ms]
      properties:
        tool: { type: string, example: read_file }
        calls: { type: integer, minimum: 1 }
        ok: { type: integer, minimum: 0 }
        error: { type: integer, minimum: 0 }
        error_rate: { type: number }
        p50_ms: { type: [number, "null"], description: Null bila tanpa data latensi. }
        p95_ms: { type: [number, "null"] }
    AuditSummaryTrafficPoint:
      type: object
      additionalProperties: false
      required: [at, calls, errors]
      properties:
        at: { type: string, format: date-time, description: Awal bucket (UTC). }
        calls: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
    SearchQualityMetric:
      type: object
      additionalProperties: false
      required: [count, denominator, rate]
      properties:
        count: { type: integer, minimum: 0 }
        denominator: { type: integer, minimum: 0 }
        rate: { type: number }
    SearchQualityRankBucket:
      type: object
      additionalProperties: false
      required: [label, count]
      properties:
        label: { type: string, description: "1..10 atau not_in_results." }
        count: { type: integer, minimum: 0 }
    AuditSummarySearchQuality:
      oneOf:
        - type: object
          additionalProperties: false
          required: [available, searches, window_seconds, zero_result, follow_up, reformulation, rank_opened, legacy_searches]
          properties:
            available: { type: boolean, const: true }
            searches: { type: integer, minimum: 0 }
            window_seconds: { type: integer, minimum: 0 }
            zero_result: { $ref: "#/components/schemas/SearchQualityMetric" }
            follow_up: { $ref: "#/components/schemas/SearchQualityMetric" }
            reformulation: { $ref: "#/components/schemas/SearchQualityMetric" }
            rank_opened:
              type: array
              items: { $ref: "#/components/schemas/SearchQualityRankBucket" }
            legacy_searches: { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [available, error_code]
          properties:
            available: { type: boolean, const: false }
            error_code: { type: string, enum: [UNAVAILABLE] }
