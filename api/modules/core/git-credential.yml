openapi: 3.1.0
info:
  title: Grimoire Git Credentials
  version: 0.1.0
paths:
  /api/me/git-credentials:
    get:
      operationId: listcredentials
      tags: [core-git-credentials]
      summary: Daftar token Git milik sendiri
      description: >
        Status Personal Access Token (PAT) milik pemanggil saja. Hanya `last4` yang dikembalikan;
        token tidak pernah dikembalikan. `enabled=false` bila server belum mengisi GIT_CREDENTIAL_KEY
        (items kosong). `allowed_gitlab_hosts` berisi host GitLab yang boleh dipakai (gitlab.com
        ditambah GIT_SYNC_ALLOWED_HOSTS). Respons memakai Cache-Control no-store.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Daftar token (items selalu array)
          headers:
            Cache-Control:
              description: Selalu no-store
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitCredentialList" }
              examples:
                enabled:
                  value:
                    enabled: true
                    allowed_gitlab_hosts: [gitlab.com, git.noobee.id]
                    items:
                      - { provider: github, host: github.com, last4: a9F3, created_at: "2026-10-22T07:00:00Z", updated_at: "2026-10-22T07:00:00Z" }
                      - { provider: gitlab, host: git.noobee.id, last4: 7Qx2, created_at: "2026-10-22T07:05:00Z", updated_at: "2026-10-22T07:10:00Z" }
                disabled:
                  value: { enabled: false, allowed_gitlab_hosts: [gitlab.com], items: [] }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
  /api/me/git-credentials/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    put:
      operationId: savecredential
      tags: [core-git-credentials]
      summary: Simpan atau ganti token Git
      description: >
        Menyimpan PAT milik pemanggil untuk (provider, host). Token diverifikasi ke provider sebelum
        disimpan, lalu dienkripsi AES-256-GCM. Token tidak pernah dikembalikan; hanya `last4`.
        Untuk github, host dipaksa github.com (host lain 422 HOST_NOT_ALLOWED). Untuk gitlab, host
        default gitlab.com dan harus ada di daftar yang diizinkan. Token 8-512 karakter ASCII tanpa
        spasi. Body maksimal 8 KiB; field tak dikenal ditolak 400. Dibatasi 10 permintaan/menit per user.
        Respons memakai Cache-Control no-store.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveGitCredentialRequest" }
            examples:
              gitlab:
                value: { host: git.noobee.id, token: glpat-xxxxxxxxxxxxxxxx7Qx2 }
              github:
                value: { token: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxa9F3 }
      responses:
        "200":
          description: Token tersimpan atau diganti
          headers:
            Cache-Control:
              description: Selalu no-store
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveGitCredentialResponse" }
              example: { provider: gitlab, host: git.noobee.id, last4: 7Qx2, updated_at: "2026-10-22T07:10:00Z", replaced: true }
        "400":
          description: Provider, host, atau token tidak valid (INVALID_ARGUMENT)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error:
                  code: INVALID_ARGUMENT
                  message: permintaan tidak valid
                  details: { fields: { token: token wajib 8-512 karakter ASCII tanpa spasi } }
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403":
          description: Header X-Requested-With tidak ada (CSRF_REQUIRED)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error: { code: CSRF_REQUIRED, message: header X-Requested-With wajib untuk request mutasi, details: null }
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "413": { $ref: "../infra/foundation.yml#/components/responses/PayloadTooLarge" }
        "422":
          description: >
            TOKEN_INVALID (provider menolak token atau token tanpa akses) atau HOST_NOT_ALLOWED
            (host di luar daftar yang diizinkan).
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              examples:
                tokenInvalid:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: token tidak valid atau tidak punya akses
                      details: { provider: gitlab, host: git.noobee.id }
                    trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
                hostNotAllowed:
                  value:
                    error:
                      code: HOST_NOT_ALLOWED
                      message: host Git tidak diizinkan; minta admin menambahkannya ke GIT_SYNC_ALLOWED_HOSTS
                      details: { host: git.contoh.com }
                    trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "429":
          description: >
            Batas permintaan per user terlampaui atau provider Git membatasi permintaan (RATE_LIMITED).
            Header Retry-After diisi bila diketahui.
          headers:
            Retry-After:
              description: Detik sebelum boleh mencoba lagi
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error:
                  code: RATE_LIMITED
                  message: provider Git membatasi permintaan; coba lagi nanti
                  details: { retry_after_seconds: 60 }
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
        "502":
          description: Provider Git tidak dapat dihubungi (GIT_UPSTREAM_ERROR)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error: { code: GIT_UPSTREAM_ERROR, message: "provider Git tidak dapat dihubungi, coba lagi", details: null }
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "503":
          description: GIT_CREDENTIAL_KEY belum diisi admin (GIT_FEATURE_DISABLED)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error: { code: GIT_FEATURE_DISABLED, message: sync Git belum dikonfigurasi oleh admin, details: null }
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
    delete:
      operationId: deletecredential
      tags: [core-git-credentials]
      summary: Hapus token Git
      description: >
        Menghapus token milik pemanggil untuk (provider, host). Query `host` opsional: github dipaksa
        github.com, gitlab default gitlab.com. Token yang tidak ada dijawab 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - name: host
          in: query
          required: false
          description: Host Git (mis. git.noobee.id). Default sesuai provider.
          schema: { type: string, maxLength: 253, example: git.noobee.id }
      responses:
        "204": { description: Token dihapus (tanpa body) }
        "400": { $ref: "../infra/foundation.yml#/components/responses/BadRequest" }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403":
          description: Header X-Requested-With tidak ada (CSRF_REQUIRED)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error: { code: CSRF_REQUIRED, message: header X-Requested-With wajib untuk request mutasi, details: null }
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "404":
          description: Token tidak ditemukan (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error: { code: NOT_FOUND, message: token tidak ditemukan, details: null }
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: grimoire_session
  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: Wajib untuk request mutasi (nilai grimoire); tanpa itu 403 CSRF_REQUIRED.
      schema: { type: string, example: grimoire }
    Provider:
      name: provider
      in: path
      required: true
      schema: { $ref: "#/components/schemas/GitProvider" }
  schemas:
    GitProvider:
      type: string
      enum: [github, gitlab]
    GitCredential:
      type: object
      additionalProperties: false
      required: [provider, host, last4, created_at, updated_at]
      properties:
        provider: { $ref: "#/components/schemas/GitProvider" }
        host: { type: string, example: git.noobee.id }
        last4: { type: string, description: Empat karakter terakhir token (token tidak pernah dikembalikan)., example: 7Qx2 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GitCredentialList:
      type: object
      additionalProperties: false
      required: [enabled, allowed_gitlab_hosts, items]
      properties:
        enabled: { type: boolean, description: false bila GIT_CREDENTIAL_KEY kosong. }
        allowed_gitlab_hosts:
          type: array
          items: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/GitCredential" }
    SaveGitCredentialRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        host:
          type: [string, "null"]
          description: Opsional. github selalu github.com; gitlab default gitlab.com.
          example: git.noobee.id
        token:
          type: string
          minLength: 8
          maxLength: 512
          description: PAT ASCII tanpa spasi. github scope repo (read); gitlab read_api dan read_repository.
          writeOnly: true
    SaveGitCredentialResponse:
      type: object
      additionalProperties: false
      required: [provider, host, last4, updated_at, replaced]
      properties:
        provider: { $ref: "#/components/schemas/GitProvider" }
        host: { type: string }
        last4: { type: string }
        updated_at: { type: string, format: date-time }
        replaced: { type: boolean, description: true bila menimpa token yang sudah ada. }
