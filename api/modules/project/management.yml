openapi: 3.1.0
info:
  title: Grimoire Project Management
  version: 0.2.0
paths:
  /api/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: Daftar project (limit/offset)
      description: >
        Developer: hanya project yang diikuti. super_admin: semua project (is_member menandai
        keanggotaan). Urutan updated_at DESC, id DESC. Parameter kosong sama dengan tidak dikirim;
        parameter tak dikenal diabaikan. counts bernilai null bila modul isi belum tersedia.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Satu halaman project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
              example:
                items:
                  - id: 0192f5a0-1111-7aaa-8bbb-000000000001
                    name: Payments
                    description: Layanan pembayaran internal
                    created_by: 0192f5a0-aaaa-7aaa-8bbb-00000000000a
                    created_by_label: a@tim.id
                    created_at: "2026-10-22T09:00:00Z"
                    updated_at: "2026-10-22T10:15:00Z"
                    my_role: member
                    access_level: member
                    is_member: true
                    member_count: 2
                    counts: { files: null, specs: null, keys: null }
                total: 1
                limit: 20
                offset: 0
        "400": { $ref: "../infra/foundation.yml#/components/responses/BadRequest" }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
    post:
      operationId: createProject
      tags: [projects]
      summary: Buat project
      description: >
        Developer yang membuat otomatis menjadi owner. super_admin membuat project tanpa anggota
        (my_role null, access_level admin, member_count 0). Nama 2-100 karakter, deskripsi maksimal
        1000 karakter; field tak dikenal ditolak 400.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
            example: { name: Payments, description: Layanan pembayaran internal }
      responses:
        "201":
          description: Project dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSummary" }
              example:
                id: 0192f5a0-1111-7aaa-8bbb-000000000001
                name: Payments
                description: Layanan pembayaran internal
                created_by: 0192f5a0-aaaa-7aaa-8bbb-00000000000a
                created_by_label: a@tim.id
                created_at: "2026-10-22T09:00:00Z"
                updated_at: "2026-10-22T09:00:00Z"
                my_role: owner
                access_level: owner
                is_member: true
                member_count: 1
                counts: { files: 0, specs: 0, keys: 0 }
        "400": { $ref: "../infra/foundation.yml#/components/responses/BadRequest" }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
  /api/projects/{projectID}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: getProject
      tags: [projects]
      summary: Detail project
      description: >
        Anggota (owner/member) dan super_admin. Project yang tidak ada, id bukan uuid, atau
        project yang bukan milik pemanggil dijawab 404 yang identik (tidak bocor).
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Detail project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Ubah nama/deskripsi project
      description: >
        Owner dan super_admin. Minimal satu field (name, description). Tanpa perubahan nyata tetap
        200 dengan data saat ini dan tanpa entri audit. Member dijawab 403; bukan anggota 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
            example: { name: Payments v2 }
      responses:
        "200":
          description: Project setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "400": { $ref: "../infra/foundation.yml#/components/responses/BadRequest" }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Hapus project (beserta isinya)
      description: >
        Owner dan super_admin. Body wajib memuat confirm_name yang persis sama dengan nama project;
        bila beda 400 dengan details.reason CONFIRMATION_MISMATCH. Penghapusan berantai ke anggota
        dan isi project. Member dijawab 403; bukan anggota 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteProjectRequest" }
            example: { confirm_name: Payments v2 }
      responses:
        "204": { description: Project dihapus }
        "400":
          description: Body tidak valid (INVALID_ARGUMENT), atau nama konfirmasi tidak cocok (details.reason CONFIRMATION_MISMATCH)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error:
                  code: INVALID_ARGUMENT
                  message: nama konfirmasi tidak cocok
                  details: { reason: CONFIRMATION_MISMATCH }
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
  /api/projects/{projectID}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listMembers
      tags: [project-members]
      summary: Daftar anggota project
      description: >
        Anggota dan super_admin. Urutan owner dulu, lalu nama, lalu id. Data user (name, email,
        is_active) diperkaya dari modul auth; bila user tidak terbaca found=false dan name/email null.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Seluruh anggota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
    post:
      operationId: addMember
      tags: [project-members]
      summary: Tambah anggota
      description: >
        Owner dan super_admin. Hanya developer aktif yang bisa ditambahkan. role default member.
        400 details.reason: USER_NOT_FOUND, USER_INACTIVE, USER_NOT_DEVELOPER. 409 details.reason
        ALREADY_MEMBER bila sudah anggota. Member dijawab 403; bukan anggota 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
            example: { user_id: 0192f5a0-cccc-7aaa-8bbb-00000000000c, role: member }
      responses:
        "201":
          description: Anggota ditambahkan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400":
          description: Body tidak valid (details.fields) atau user tidak memenuhi syarat (details.reason)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              examples:
                user_inactive:
                  value:
                    error:
                      code: INVALID_ARGUMENT
                      message: user nonaktif tidak bisa ditambahkan sebagai anggota
                      details: { reason: USER_INACTIVE }
                    trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
                user_not_developer:
                  value:
                    error:
                      code: INVALID_ARGUMENT
                      message: hanya developer yang bisa ditambahkan sebagai anggota; Super Admin tidak perlu menjadi anggota
                      details: { reason: USER_NOT_DEVELOPER }
                    trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
                user_not_found:
                  value:
                    error:
                      code: INVALID_ARGUMENT
                      message: user tidak ditemukan
                      details: { reason: USER_NOT_FOUND }
                    trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
                missing_field:
                  value:
                    error:
                      code: INVALID_ARGUMENT
                      message: permintaan tidak valid
                      details: { fields: { user_id: wajib diisi } }
                    trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409":
          description: User sudah menjadi anggota (CONFLICT, details.reason ALREADY_MEMBER)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error:
                  code: CONFLICT
                  message: user sudah menjadi anggota
                  details: { reason: ALREADY_MEMBER }
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
  /api/projects/{projectID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/UserID"
    patch:
      operationId: changeMemberRole
      tags: [project-members]
      summary: Ubah peran anggota
      description: >
        Owner dan super_admin. Peran sama dengan saat ini adalah no-op: 200 tanpa audit. Menurunkan
        owner terakhir dijawab 409 LAST_OWNER (kecuali dilakukan super_admin). Member dijawab 403;
        bukan anggota 404; target bukan anggota 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeMemberRoleRequest" }
            example: { role: owner }
      responses:
        "200":
          description: Anggota setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "../infra/foundation.yml#/components/responses/BadRequest" }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/LastOwner" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
    delete:
      operationId: removeMember
      tags: [project-members]
      summary: Keluarkan anggota atau keluar sendiri
      description: >
        Owner mengeluarkan anggota mana pun; anggota biasa hanya boleh mengeluarkan dirinya sendiri
        (keluar); selain itu 403. Owner terakhir tidak bisa keluar (409 LAST_OWNER), kecuali
        dilakukan super_admin. Tanpa body. Target bukan anggota 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      responses:
        "204": { description: Anggota dikeluarkan }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/LastOwner" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
  /api/projects/{projectID}/member-candidates:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: searchMemberCandidates
      tags: [project-members]
      summary: Cari kandidat anggota (autocomplete)
      description: >
        Owner dan super_admin. Developer aktif yang belum menjadi anggota, dicocokkan dengan q
        (nama atau email). q kosong menghasilkan daftar kosong. Member dijawab 403; bukan anggota 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Kandidat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCandidateList" }
              example:
                items:
                  - { id: 0192f5a0-cccc-7aaa-8bbb-00000000000c, name: Budiman, email: budiman@tim.id, invitation_pending: false }
        "400": { $ref: "../infra/foundation.yml#/components/responses/BadRequest" }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
  /api/projects/{projectID}/invitations:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listInvitations
      tags: [project-invitations]
      summary: Daftar undangan yang masih menunggu
      description: >
        Owner dan super_admin. Hanya anggota berstatus undangan menunggu (termasuk yang sudah
        kedaluwarsa atau gagal terkirim). Urutan added_at menurun. Member dijawab 403; bukan
        anggota 404. Gagal membaca data user dijawab 500.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Undangan menunggu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
              example:
                items:
                  - user_id: 7c1f3c2e-5b7a-4d7e-9a51-1f0b8a3e6d21
                    email: baru@contoh.id
                    name: Budi
                    role: member
                    invited_by_label: Owner Satu
                    added_at: "2026-10-21T08:15:00Z"
                    sent_at: null
                    expires_at: "2026-10-28T08:15:00Z"
                    expired: false
                    delivery_status: failed
                    email_failed: true
                    resend_count: 1
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
    post:
      operationId: inviteToProject
      tags: [project-invitations]
      summary: Undang developer baru lewat email dan jadikan anggota
      description: >
        Owner dan super_admin. Mencatat keanggotaan, lalu menerbitkan password sementara dan
        mengirim email (lewat modul auth). Keanggotaan tetap tercatat walau penerbitan atau
        pengiriman gagal; respons 201 dengan email_sent false dan email_status failed (tanpa
        credentials), pulihkan lewat Kirim ulang. credentials hanya ada bila email tidak terkirim
        dengan header Cache-Control no-store, tampil sekali. role default member. Member dijawab
        403; bukan anggota 404. 409: CONFLICT details.reason ALREADY_MEMBER, atau ALREADY_REGISTERED
        (details.reason registered, inactive, not_developer) bila email milik akun terdaftar.
        429 RATE_LIMITED details.scope invite (kuota 20 per jam per pengundang) atau resend.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteMemberRequest" }
            example: { email: baru@contoh.id, role: member, name: Budi }
      responses:
        "201":
          description: Anggota dicatat dan undangan diproses
          headers:
            Cache-Control:
              description: no-store, hanya bila respons memuat credentials
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteMemberResponse" }
              examples:
                sent:
                  value:
                    member:
                      user_id: 7c1f3c2e-5b7a-4d7e-9a51-1f0b8a3e6d21
                      name: Budi
                      email: baru@contoh.id
                      is_active: true
                      found: true
                      role: member
                      added_at: "2026-10-21T08:15:00Z"
                      added_by: 0192f5a0-aaaa-7aaa-8bbb-00000000000a
                      added_by_label: Owner Satu
                      invitation_pending: true
                      invitation_expires_at: "2026-10-28T08:15:00Z"
                    created: true
                    email_sent: true
                    email_status: sent
                    expires_at: "2026-10-28T08:15:00Z"
                fallback:
                  value:
                    member:
                      user_id: 7c1f3c2e-5b7a-4d7e-9a51-1f0b8a3e6d21
                      name: Budi
                      email: baru@contoh.id
                      is_active: true
                      found: true
                      role: member
                      added_at: "2026-10-21T08:15:00Z"
                      added_by: 0192f5a0-aaaa-7aaa-8bbb-00000000000a
                      added_by_label: Owner Satu
                      invitation_pending: true
                      invitation_expires_at: "2026-10-28T08:15:00Z"
                    created: true
                    email_sent: false
                    email_status: not_configured
                    expires_at: "2026-10-28T08:15:00Z"
                    credentials:
                      email: baru@contoh.id
                      temporary_password: q7XkR2mVtz9HbNcP
                      login_url: https://grimoire.contoh.id/login
        "400": { $ref: "../infra/foundation.yml#/components/responses/BadRequest" }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409":
          description: Sudah anggota (CONFLICT ALREADY_MEMBER) atau email milik akun terdaftar (ALREADY_REGISTERED)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              examples:
                already_member:
                  value:
                    error:
                      code: CONFLICT
                      message: user sudah menjadi anggota project
                      details: { reason: ALREADY_MEMBER }
                    trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
                already_registered:
                  value:
                    error:
                      code: ALREADY_REGISTERED
                      message: email sudah terdaftar
                      details: { reason: registered }
                    trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "429": { $ref: "#/components/responses/InvitationRateLimited" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
  /api/projects/{projectID}/invitations/{userID}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: revokeInvitation
      tags: [project-invitations]
      summary: Cabut undangan yang masih menunggu
      description: >
        Owner dan super_admin. Tanpa body. Hanya untuk undangan yang masih menunggu; mengeluarkan
        anggota dari project dan membersihkan akun menunggu bila tidak punya keanggotaan lain.
        Member dijawab 403; bukan anggota, project tidak ada, atau projectID bukan uuid 404.
        409 CONFLICT details.reason INVITATION_NOT_PENDING (undangan sudah diterima atau tidak
        ada) atau LAST_OWNER.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      responses:
        "204": { description: Undangan dicabut }
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409":
          description: Undangan tidak menunggu (INVITATION_NOT_PENDING) atau owner terakhir (LAST_OWNER)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              examples:
                not_pending:
                  value:
                    error:
                      code: CONFLICT
                      message: undangan sudah diterima atau tidak ada
                      details: { reason: INVITATION_NOT_PENDING }
                    trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
                last_owner:
                  value:
                    error:
                      code: CONFLICT
                      message: owner terakhir tidak bisa keluar atau diturunkan; angkat owner lain lebih dulu
                      details: { reason: LAST_OWNER }
                    trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
  /api/projects/{projectID}/invitations/{userID}/resend:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: resendProjectInvitation
      tags: [project-invitations]
      summary: Kirim ulang undangan project
      description: >
        Owner dan super_admin. Tanpa body. Menerbitkan password sementara baru dan memperpanjang
        expires_at; berlaku juga untuk undangan kedaluwarsa. Kuota 3 per jam per undangan (429
        scope resend). credentials hanya ada bila email tidak terkirim, dengan header
        Cache-Control no-store. Member dijawab 403; bukan anggota atau target bukan anggota 404.
        409 CONFLICT INVITATION_NOT_PENDING bila undangan sudah diterima atau tidak ada.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      responses:
        "200":
          description: Undangan diterbitkan ulang
          headers:
            Cache-Control:
              description: no-store, hanya bila respons memuat credentials
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResendInvitationResponse" }
              examples:
                sent:
                  value: { email_sent: true, email_status: sent, expires_at: "2026-10-28T09:00:00Z" }
                fallback:
                  value:
                    email_sent: false
                    email_status: failed
                    expires_at: "2026-10-28T09:00:00Z"
                    credentials:
                      email: baru@contoh.id
                      temporary_password: Zp4wNe8TqYv3KdRh
                      login_url: https://grimoire.contoh.id/login
        "401": { $ref: "../infra/foundation.yml#/components/responses/Unauthorized" }
        "403": { $ref: "../infra/foundation.yml#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409":
          description: Undangan tidak menunggu (CONFLICT INVITATION_NOT_PENDING)
          content:
            application/json:
              schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
              example:
                error:
                  code: CONFLICT
                  message: undangan sudah diterima atau tidak ada
                  details: { reason: INVITATION_NOT_PENDING }
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        "429": { $ref: "#/components/responses/InvitationRateLimited" }
        "500": { $ref: "../infra/foundation.yml#/components/responses/Internal" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: grimoire_session
  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: Wajib untuk request mutasi (nilai grimoire); tanpa itu 403 CSRF_REQUIRED.
      schema: { type: string, example: grimoire }
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    Q:
      name: q
      in: query
      description: Mencocokkan nama project (tak peka huruf besar-kecil).
      schema: { type: string, maxLength: 100 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    InvitationRateLimited:
      description: Kuota undangan atau kirim ulang habis (RATE_LIMITED); details.scope invite atau resend
      headers:
        Retry-After:
          description: Detik sebelum boleh mencoba lagi
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
          example:
            error:
              code: RATE_LIMITED
              message: terlalu banyak permintaan undangan
              details: { retry_after_seconds: 1840, scope: resend }
            trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
    ProjectNotFound:
      description: >
        Tidak ditemukan (NOT_FOUND). Juga untuk project yang bukan milik pemanggil atau id bukan
        uuid (tidak bocor); untuk operasi anggota juga bila target bukan anggota.
      content:
        application/json:
          schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
          example:
            error: { code: NOT_FOUND, message: project tidak ditemukan, details: null }
            trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
    LastOwner:
      description: Owner terakhir tidak bisa keluar atau diturunkan (CONFLICT, details.reason LAST_OWNER)
      content:
        application/json:
          schema: { $ref: "../infra/foundation.yml#/components/schemas/Error" }
          example:
            error:
              code: CONFLICT
              message: owner terakhir tidak bisa keluar atau diturunkan; angkat owner lain lebih dulu
              details: { reason: LAST_OWNER }
            trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
  schemas:
    ProjectRole:
      type: string
      enum: [owner, member]
    ContentCounts:
      type: object
      description: Jumlah isi project; null bila modul isi belum tersedia atau gagal dibaca.
      required: [files, specs, keys]
      properties:
        files: { type: [integer, "null"] }
        specs: { type: [integer, "null"] }
        keys: { type: [integer, "null"] }
    Project:
      type: object
      required: [id, name, description, created_by, created_by_label, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        created_by: { type: [string, "null"], format: uuid }
        created_by_label: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectSummary:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [my_role, access_level, is_member, member_count, counts]
          properties:
            my_role:
              description: Peran pemanggil di project; null bila bukan anggota.
              oneOf:
                - $ref: "#/components/schemas/ProjectRole"
                - type: "null"
            access_level: { type: string, enum: [owner, member, admin] }
            is_member: { type: boolean }
            member_count: { type: integer, minimum: 0 }
            counts: { $ref: "#/components/schemas/ContentCounts" }
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          required: [owner_count]
          properties:
            owner_count: { type: integer, minimum: 0 }
    ProjectList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectSummary" }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, maxLength: 1000, default: "" }
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
    DeleteProjectRequest:
      type: object
      additionalProperties: false
      required: [confirm_name]
      properties:
        confirm_name: { type: string }
    Member:
      type: object
      required: [user_id, name, email, is_active, found, role, added_at, added_by, added_by_label, invitation_pending, invitation_expires_at]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        is_active: { type: boolean }
        found: { type: boolean, description: "false bila data user gagal dibaca; name/email null." }
        role: { $ref: "#/components/schemas/ProjectRole" }
        added_at: { type: string, format: date-time }
        added_by: { type: [string, "null"], format: uuid }
        added_by_label: { type: string }
        invitation_pending: { type: boolean, description: true bila anggota belum menerima undangan email. }
        invitation_expires_at:
          type: [string, "null"]
          format: date-time
          description: Batas waktu undangan; null bila tidak ada undangan menunggu.
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    MemberCandidate:
      type: object
      required: [id, name, email, invitation_pending]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        invitation_pending: { type: boolean, description: true bila akun masih menunggu undangan diterima. }
    MemberCandidateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MemberCandidate" }
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/ProjectRole", default: member }
    ChangeMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/ProjectRole" }
    Invitation:
      type: object
      required: [user_id, email, name, role, invited_by_label, added_at, sent_at, expires_at, expired, delivery_status, email_failed, resend_count]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
        invited_by_label: { type: string }
        added_at: { type: string, format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
        expired: { type: boolean }
        delivery_status: { type: string, enum: [pending, sent, failed, not_configured] }
        email_failed: { type: boolean, description: true bila pengiriman terakhir gagal atau email tidak dikonfigurasi. }
        resend_count: { type: integer, minimum: 0 }
    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
    InviteMemberRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        role: { $ref: "#/components/schemas/ProjectRole", default: member }
        name: { type: string, maxLength: 100, description: Opsional; bila kosong diturunkan dari email. }
    InviteMemberResponse:
      type: object
      required: [member, created, email_sent, email_status, expires_at]
      properties:
        member: { $ref: "#/components/schemas/Member" }
        created: { type: boolean, description: false bila akun menunggu yang sudah ada diterbitkan ulang. }
        email_sent: { type: boolean }
        email_status: { $ref: "../core/auth.yml#/components/schemas/InvitationStatus" }
        expires_at: { type: string, format: date-time }
        credentials: { $ref: "../core/auth.yml#/components/schemas/InvitationCredentials" }
    ResendInvitationResponse:
      type: object
      required: [email_sent, email_status, expires_at]
      properties:
        email_sent: { type: boolean }
        email_status: { $ref: "../core/auth.yml#/components/schemas/InvitationStatus" }
        expires_at: { type: string, format: date-time }
        credentials: { $ref: "../core/auth.yml#/components/schemas/InvitationCredentials" }
