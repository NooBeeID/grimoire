      description: |
        Anggota (owner/member) dan super_admin. Setiap file divalidasi sebagai OpenAPI 3.0.x/3.1.x atau Swagger 2.0 (maks APISPEC_MAX_FILE_BYTES per file, UTF-8, .yaml/.yml/.json). Spec bernama sama ditimpa (status updated; unchanged bila isi identik). Hasil dilaporkan per file; kegagalan satu file tidak membatalkan file lain. File disimpan dan diunduh apa adanya (Swagger 2.0 tidak dikonversi ke 3.x); openapi_version berisi "2.0" untuk Swagger 2.0. Referensi eksternal ($ref URL/file) tidak pernah di-fetch dan ditolak. Field name hanya boleh dipakai saat tepat satu file.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApiSpecUploadRequest'
      responses:
        '200':
          description: Laporan per file (status 200 meskipun sebagian file rejected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSpecUploadResult'
              example:
                results:
                  - file: petstore.yaml
                    source_path: specs/petstore.yaml
                    name: petstore
                    status: created
                    reason_code: null
                    reason: null
                    issues: []
                    openapi_version: '2.0'
                    title: Swagger Petstore
                    api_version: 1.0.0
                    endpoint_count: 4
                  - file: payment.yaml
                    source_path: specs/payment.yaml
                    name: payment
                    status: updated
                    reason_code: null
                    reason: null
                    issues: []
                    openapi_version: 3.0.3
                    title: Payment API
                    api_version: 1.4.0
                    endpoint_count: 12
                  - file: package.json
                    source_path: specs/package.json
                    name: package
                    status: rejected
                    reason_code: INVALID_SPEC
                    reason: bukan dokumen OpenAPI
                    issues:
                      - code: NOT_OPENAPI
                        message: bukan dokumen OpenAPI
                        pointer: '#'
                        line: 1
                    openapi_version: null
                    title: null
                    api_version: null
                    endpoint_count: null
                summary:
                  created: 1
                  updated: 1
                  unchanged: 0
                  skipped: 0
                  rejected: 1
        '400':
          description: |
            Validasi request gagal (INVALID_ARGUMENT). details.reason: NO_FILES, NAME_WITH_MULTIPLE_FILES, atau INVALID_NAME (dengan details.fields.name).
          content:
            application/json:
              schema:
