    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: resendUserInvitation
      tags:
        - users
      summary: Kirim ulang undangan (khusus super_admin)
      description: |
        Tanpa body. Menerbitkan password sementara baru, memperpanjang expires_at, mencabut semua sesi target, lalu mengirim email. Berlaku juga untuk undangan yang sudah kedaluwarsa (jalur pemulihan). Kuota 3 kirim ulang per jam per undangan (429 scope resend). Credentials hanya ada bila email tidak terkirim, dengan header Cache-Control no-store. 404 bila user tidak ada atau id bukan uuid. 409 CONFLICT details.reason INVITATION_NOT_PENDING (undangan sudah diterima atau tidak ada) atau ALREADY_REGISTERED details.reason inactive (akun nonaktif).
