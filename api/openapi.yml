  /api/projects/{projectID}/knowledge/upload:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: uploadKnowledgeFiles
      tags:
        - project-knowledge
      summary: Upload banyak file (atau folder) sekaligus
      description: |
        Anggota (owner/member) dan super_admin. multipart/form-data dengan part berulang `files`; `filename` setiap part membawa path relatif (mis. docs/auth/login.md). File yang valid tetap masuk walau file lain ditolak; hasil dilaporkan per file sesuai urutan request. Status: created, updated, unchanged, skipped (mis. hidden), rejected (mis. path_traversal, too_large, unsupported_type, invalid_encoding). 400 details.reason: no_files, not_multipart, too_many_files, project_file_limit. 413 details.reason upload_too_large bila total melebihi batas upload. Bukan anggota atau id bukan uuid dijawab 404 yang identik.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Laporan upload per file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeUploadResult'
              example:
                summary:
                  created: 2
                  updated: 1
                  unchanged: 3
                  skipped: 1
                  rejected: 2
                items:
                  - path: docs/auth/login.md
                    status: created
                  - path: ../x.md
                    status: rejected
                    reason: path_traversal
                  - path: docs/big.md
                    status: rejected
                    reason: too_large
                  - path: .git/config
                    status: skipped
                    reason: hidden
                  - path: docs/readme.md
                    status: updated
                  - path: docs/a.md
                    status: unchanged
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/responses-ProjectNotFound'
        '413':
          description: Total ukuran upload melebihi batas (PAYLOAD_TOO_LARGE, reason upload_too_large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: ukuran total upload melebihi batas
                  details:
                    reason: upload_too_large
                    max_bytes: 52428800
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        '500':
          $ref: '#/components/responses/Internal'
