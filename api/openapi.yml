        Owner dan super_admin. Hanya developer aktif yang bisa ditambahkan. role default member. 400 details.reason: USER_NOT_FOUND, USER_INACTIVE, USER_NOT_DEVELOPER. 409 details.reason ALREADY_MEMBER bila sudah anggota. Member dijawab 403; bukan anggota 404.
      security:
