        created_by_label:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_by:
          type:
            - string
            - 'null'
          format: uuid
        revoked_by_label:
          type:
            - string
            - 'null'
