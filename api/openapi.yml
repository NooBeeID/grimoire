    ApiSpec:
      type: object
      additionalProperties: false
      required:
        - name
        - title
        - openapi_version
        - api_version
        - format
        - source_path
        - size_bytes
        - endpoint_count
        - created_at
        - created_by_label
        - updated_at
        - updated_by_label
      properties:
        name:
          type: string
          pattern: ^[a-z0-9._-]{1,80}$
        title:
          type: string
        openapi_version:
          type: string
          example: 3.0.3
          description: Versi dokumen; nomor openapi untuk 3.x, atau "2.0" untuk Swagger 2.0.
        api_version:
          type: string
          example: 1.4.0
        format:
          type: string
          enum:
            - yaml
            - json
        source_path:
          type:
            - string
            - 'null'
        size_bytes:
          type: integer
        endpoint_count:
          type: integer
        created_at:
          type: string
          format: date-time
        created_by_label:
          type:
            - string
            - 'null'
        updated_at:
          type: string
          format: date-time
        updated_by_label:
          type:
            - string
            - 'null'
    ApiSpecList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiSpec'
        total:
          type: integer
        limit:
          type: integer
