      responses:
        '200':
          description: Teks spec asli
          headers:
            Content-Disposition:
              description: attachment; filename="<name>.<yaml|json>"
              schema:
                type: string
                example: attachment; filename="payment.yaml"
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/yaml:
              schema:
                type: string
            application/json:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SpecNotFound'
        '500':
          $ref: '#/components/responses/Internal'
components:
  schemas:
    Error:
      type: object
      description: Format error seragam untuk semua error /api.
      required:
        - error
        - trace_id
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
            details:
              description: Data tambahan yang aman ditampilkan (objek, array), atau null.
        trace_id:
          type: string
    AuditEntrySummary:
      type: object
      required:
        - id
        - occurred_at
        - actor_type
        - actor_id
        - actor_label
        - project_id
        - project_label
        - action
        - target_type
        - target
        - status
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor_type:
          $ref: '#/components/schemas/ActorType'
        actor_id:
          type:
            - string
            - 'null'
          format: uuid
        actor_label:
          type: string
        project_id:
          type:
            - string
            - 'null'
          format: uuid
        project_label:
          type:
            - string
            - 'null'
        action:
          type: string
          example: mcp.read_file
        target_type:
          type:
            - string
            - 'null'
        target:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/AuditStatus'
    AuditEntryList:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntrySummary'
        next_cursor:
          type:
            - string
            - 'null'
          description: Null pada halaman terakhir.
    AuditEntryDetail:
      allOf:
        - $ref: '#/components/schemas/AuditEntrySummary'
        - type: object
          required:
            - args
            - result
            - ip
            - user_agent
            - trace_id
          properties:
            args:
              type: object
              additionalProperties: true
              description: Argumen yang sudah disanitasi.
            result:
              type: object
              additionalProperties: true
            ip:
              type:
                - string
                - 'null'
            user_agent:
              type:
                - string
                - 'null'
            trace_id:
              type:
                - string
                - 'null'
    Me:
      type: object
      required:
        - id
        - email
        - name
        - role
        - must_change_password
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        must_change_password:
          type: boolean
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
        - is_active
        - must_change_password
        - created_at
        - created_by
        - created_by_label
        - updated_at
        - last_login_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          type:
            - string
            - 'null'
          format: uuid
        created_by_label:
          type:
            - string
            - 'null'
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type:
            - string
            - 'null'
          format: date-time
    UserList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    UserWithTempPassword:
      type: object
      required:
        - user
        - temporary_password
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporary_password:
          type:
            - string
            - 'null'
          description: Hanya terisi bila dibangkitkan server; tampil sekali dan tidak dapat diambil lagi.
    Project:
      type: object
      required:
        - id
        - name
        - description
        - created_by
        - created_by_label
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_by:
          type:
            - string
            - 'null'
          format: uuid
        created_by_label:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectSummary:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          required:
            - my_role
            - access_level
            - is_member
            - member_count
            - counts
          properties:
            my_role:
              description: Peran pemanggil di project; null bila bukan anggota.
              oneOf:
                - $ref: '#/components/schemas/ProjectRole'
                - type: 'null'
            access_level:
              type: string
              enum:
                - owner
                - member
                - admin
            is_member:
              type: boolean
            member_count:
              type: integer
              minimum: 0
            counts:
              $ref: '#/components/schemas/ContentCounts'
    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          required:
            - owner_count
          properties:
            owner_count:
              type: integer
              minimum: 0
    ProjectList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    Member:
      type: object
      required:
        - user_id
        - name
        - email
        - is_active
        - found
        - role
        - added_at
        - added_by
        - added_by_label
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
        is_active:
          type: boolean
        found:
          type: boolean
          description: false bila data user gagal dibaca; name/email null.
        role:
          $ref: '#/components/schemas/ProjectRole'
        added_at:
          type: string
          format: date-time
        added_by:
          type:
            - string
            - 'null'
          format: uuid
        added_by_label:
          type: string
    MemberList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    MemberCandidateList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberCandidate'
    ApiKey:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - prefix
        - status
        - created_by
        - created_by_label
        - created_at
        - last_used_at
        - revoked_at
        - revoked_by
        - revoked_by_label
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: 8 karakter pertama bagian identitas key (bukan secret)
        status:
          type: string
          enum:
            - active
            - revoked
        created_by:
          type:
            - string
            - 'null'
          format: uuid
        created_by_label:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_by:
          type:
            - string
            - 'null'
          format: uuid
        revoked_by_label:
          type:
            - string
            - 'null'
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
    CreateApiKeyResponse:
      type: object
      additionalProperties: false
      required:
        - key
        - raw_key
        - mcp_url
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        raw_key:
          type: string
          pattern: ^gr_[a-z0-9]{8}_[A-Za-z0-9_-]{43}$
          description: raw_key hanya dikembalikan sekali; simpan sekarang.
        mcp_url:
          type:
            - string
            - 'null'
          format: uri
          description: null bila PUBLIC_URL tidak diset (FE memakai window.location.origin + /mcp).
    ApiKeyList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
    ApiKeyEnvelope:
      type: object
      additionalProperties: false
      required:
        - key
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
    KnowledgeUserRef:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
    KnowledgeFile:
      type: object
      required:
        - path
        - title
        - content
        - size_bytes
        - version
        - created_at
        - created_by
        - updated_at
        - updated_by
      properties:
        path:
          type: string
        title:
          type: string
        content:
          type: string
        size_bytes:
          type: integer
        version:
          type: string
          description: Hash isi (64 hex); dikirim kembali pada updateKnowledgeFile.
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/KnowledgeUserRef'
        updated_at:
          type: string
          format: date-time
        updated_by:
          $ref: '#/components/schemas/KnowledgeUserRef'
    KnowledgeCreateRequest:
      type: object
      additionalProperties: false
      required:
        - path
        - content
      properties:
        path:
          type: string
        content:
          type: string
    KnowledgeUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - content
        - version
      properties:
        content:
          type: string
        version:
          type: string
          description: Nilai version dari getKnowledgeFile.
    KnowledgeMoveRequest:
      type: object
      additionalProperties: false
      required:
        - from
        - to
      properties:
        from:
          type: string
        to:
          type: string
    KnowledgeFolderNode:
      type: object
      required:
        - name
        - path
        - file_count
      properties:
        name:
          type: string
        path:
          type: string
        file_count:
          type: integer
    KnowledgeFileNode:
      type: object
      required:
        - name
        - path
        - size_bytes
        - updated_at
      properties:
        name:
          type: string
        path:
          type: string
        size_bytes:
          type: integer
        updated_at:
          type: string
          format: date-time
    KnowledgeTree:
      type: object
      required:
        - prefix
        - folders
        - files
        - total_files
      properties:
        prefix:
          type: string
        folders:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeFolderNode'
        files:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeFileNode'
        total_files:
          type: integer
    KnowledgeUploadItem:
      type: object
      required:
        - path
        - status
      properties:
        path:
          type: string
        status:
          type: string
          enum:
            - created
            - updated
            - unchanged
            - skipped
            - rejected
        reason:
          type: string
          description: Alasan untuk status skipped/rejected (mis. hidden, path_traversal, too_large).
    KnowledgeUploadResult:
      type: object
      required:
        - summary
        - items
      properties:
        summary:
          type: object
          required:
            - created
            - updated
            - unchanged
            - skipped
            - rejected
          properties:
            created:
              type: integer
            updated:
              type: integer
            unchanged:
              type: integer
            skipped:
              type: integer
            rejected:
              type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeUploadItem'
    KnowledgeSnippetSegment:
      type: object
      required:
        - text
        - highlight
      properties:
        text:
          type: string
        highlight:
          type: boolean
    KnowledgeSearchItem:
      type: object
      required:
        - path
        - title
        - score
        - snippet
      properties:
        path:
          type: string
        title:
          type: string
        score:
          type: number
        snippet:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSnippetSegment'
    KnowledgeSearchResult:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSearchItem'
        total:
          type: integer
    KnowledgeConflictDetails:
      type: object
      required:
        - reason
        - current
      properties:
        reason:
          type: string
          enum:
            - version_conflict
        current:
          type: object
          required:
            - content
            - version
            - updated_at
            - updated_by_label
          properties:
            content:
              type: string
            version:
              type: string
            updated_at:
              type: string
              format: date-time
            updated_by_label:
              type: string
    KnowledgeDeleteFolderResult:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: integer
    ApiSpec:
      type: object
      additionalProperties: false
      required:
        - name
        - title
        - openapi_version
        - api_version
        - format
        - source_path
        - size_bytes
        - endpoint_count
        - created_at
        - created_by_label
        - updated_at
        - updated_by_label
      properties:
        name:
          type: string
          pattern: ^[a-z0-9._-]{1,80}$
        title:
          type: string
        openapi_version:
          type: string
          example: 3.0.3
          description: Versi dokumen; nomor openapi untuk 3.x, atau "2.0" untuk Swagger 2.0.
        api_version:
          type: string
          example: 1.4.0
        format:
          type: string
          enum:
            - yaml
            - json
        source_path:
          type:
            - string
            - 'null'
        size_bytes:
          type: integer
        endpoint_count:
          type: integer
        created_at:
          type: string
          format: date-time
        created_by_label:
          type:
            - string
            - 'null'
        updated_at:
          type: string
          format: date-time
        updated_by_label:
          type:
            - string
            - 'null'
    ApiSpecList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiSpec'
        total:
          type: integer
        limit:
          type: integer
          description: Batas jumlah spec per project
    ApiSpecEnvelope:
      type: object
      additionalProperties: false
      required:
        - spec
      properties:
        spec:
          $ref: '#/components/schemas/ApiSpec'
    ApiSpecEndpoint:
      type: object
      additionalProperties: false
      required:
        - method
        - path
        - operation_id
        - summary
        - tags
        - deprecated
      properties:
        method:
          type: string
          example: GET
        path:
          type: string
          example: /payments
        operation_id:
          type:
            - string
            - 'null'
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        deprecated:
          type: boolean
    ApiSpecDetail:
      type: object
      additionalProperties: false
      required:
        - spec
        - endpoints
        - document
      properties:
        spec:
          $ref: '#/components/schemas/ApiSpec'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ApiSpecEndpoint'
        document:
          type: object
          additionalProperties: true
          description: Dokumen spec sebagai JSON apa adanya (openapi untuk 3.x, swagger "2.0" untuk Swagger 2.0); $ref internal dipertahankan, urutan kunci mengikuti file asli.
    RenameApiSpecRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          pattern: ^[a-z0-9._-]{1,80}$
    ApiSpecUploadRequest:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          minItems: 1
          items:
            type: string
            format: binary
          description: Satu atau banyak file; nama file (dengan path folder bila ada) menjadi source_path.
        name:
          type: string
          pattern: ^[a-z0-9._-]{1,80}$
          description: Opsional; hanya boleh dipakai saat tepat satu file. Default nama file tanpa ekstensi.
    ApiSpecIssue:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - pointer
        - line
      properties:
        code:
          type: string
          example: EXTERNAL_REF
        message:
          type: string
        pointer:
          type:
            - string
            - 'null'
          description: JSON pointer lokasi masalah
        line:
          type:
            - integer
            - 'null'
    ApiSpecFileResult:
      type: object
      additionalProperties: false
      required:
        - file
        - source_path
        - name
        - status
        - reason_code
        - reason
        - issues
        - openapi_version
        - title
        - api_version
        - endpoint_count
      properties:
        file:
          type: string
        source_path:
          type:
            - string
            - 'null'
        name:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - created
            - updated
            - unchanged
            - valid
            - skipped
            - rejected
          description: created/updated/unchanged hanya pada upload; valid hanya pada validate.
        reason_code:
          type:
            - string
            - 'null'
          description: |
            Mis. INVALID_SPEC, NOT_SPEC_FILE, FILE_TOO_LARGE, DUPLICATE_NAME_IN_UPLOAD, SPEC_LIMIT_REACHED.
        reason:
          type:
            - string
            - 'null'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ApiSpecIssue'
        openapi_version:
          type:
            - string
            - 'null'
          description: Versi dokumen; nomor openapi untuk 3.x, atau "2.0" untuk Swagger 2.0.
        title:
          type:
            - string
            - 'null'
        api_version:
          type:
            - string
            - 'null'
        endpoint_count:
          type:
            - integer
            - 'null'
    ApiSpecUploadResult:
      type: object
      additionalProperties: false
      required:
        - results
        - summary
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ApiSpecFileResult'
        summary:
          type: object
          additionalProperties: false
          required:
            - created
            - updated
            - unchanged
            - skipped
            - rejected
          properties:
            created:
              type: integer
            updated:
              type: integer
            unchanged:
              type: integer
            skipped:
              type: integer
            rejected:
              type: integer
    ApiSpecValidateResult:
      type: object
      additionalProperties: false
      required:
        - results
        - summary
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ApiSpecFileResult'
        summary:
          type: object
          additionalProperties: false
          required:
            - valid
            - skipped
            - rejected
          properties:
            valid:
              type: integer
            skipped:
              type: integer
            rejected:
              type: integer
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
    ActorType:
      type: string
      enum:
        - user
        - api_key
        - anonymous
        - system
    AuditStatus:
      type: string
      enum:
        - ok
        - error
        - denied
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 256
          writeOnly: true
    Role:
      type: string
      enum:
        - super_admin
        - developer
    LoginResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/Me'
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          maxLength: 256
          writeOnly: true
        new_password:
          type: string
          maxLength: 256
          writeOnly: true
          description: Minimal PASSWORD_MIN_LENGTH karakter, beda dari password lama dan dari email.
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - name
        - role
      properties:
        email:
          type: string
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          maxLength: 256
          writeOnly: true
          description: Opsional; bila kosong server membangkitkan password sementara.
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          maxLength: 256
          writeOnly: true
          description: Opsional; bila kosong server membangkitkan password sementara.
    ProjectRole:
      type: string
      enum:
        - owner
        - member
    ContentCounts:
      type: object
      description: Jumlah isi project; null bila modul isi belum tersedia atau gagal dibaca.
      required:
        - files
        - specs
        - keys
      properties:
        files:
          type:
            - integer
            - 'null'
        specs:
          type:
            - integer
            - 'null'
        keys:
          type:
            - integer
            - 'null'
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 1000
          default: ''
