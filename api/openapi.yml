          enum:
            - 24h
            - 7d
            - 30d
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
          description: Eksklusif.
        project_id:
          type:
            - string
            - 'null'
          format: uuid
        top_files:
          oneOf:
            - type: 'null'
