      schema:
        type: integer
        minimum: 0
        default: 0
    ProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KeyID:
      name: keyID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Path:
