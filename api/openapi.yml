            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: GIT_UPSTREAM_ERROR
                  message: provider Git tidak dapat dihubungi, coba lagi
                  details: null
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        '503':
          description: Fitur Git belum dikonfigurasi admin (GIT_FEATURE_DISABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: GIT_FEATURE_DISABLED
                  message: sync Git belum dikonfigurasi oleh admin
                  details: null
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        '504':
          description: Sync melebihi batas waktu (TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: TIMEOUT
                  message: sync melebihi batas waktu
                  details: null
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
components:
  schemas:
    Error:
      type: object
      description: Format error seragam untuk semua error /api.
      required:
        - error
        - trace_id
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
            details:
              description: Data tambahan yang aman ditampilkan (objek, array), atau null.
        trace_id:
          type: string
    AuditEntrySummary:
      type: object
      required:
        - id
        - occurred_at
        - actor_type
        - actor_id
        - actor_label
        - project_id
        - project_label
        - action
        - target_type
        - target
        - status
