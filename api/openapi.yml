                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_ARGUMENT
                  message: permintaan tidak valid
                  details:
                    fields:
                      name: nama key wajib 2-60 karakter
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
