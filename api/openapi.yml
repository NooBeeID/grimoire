        - key
        - raw_key
        - mcp_url
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        raw_key:
          type: string
          pattern: ^gr_[a-z0-9]{8}_[A-Za-z0-9_-]{43}$
