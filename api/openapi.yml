                - string
                - 'null'
            trace_id:
              type:
                - string
                - 'null'
    AuditSummary:
      type: object
      additionalProperties: false
      required:
        - range
        - from
        - to
        - bucket
        - project_id
        - total_calls
        - total_errors
        - error_rate
        - top_projects
        - tool_usage
        - tool_metrics
        - traffic
        - search_quality
      properties:
        range:
          type: string
          enum:
            - 24h
            - 7d
            - 30d
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
          description: Eksklusif.
        bucket:
          type: string
          enum:
            - hour
            - day
        project_id:
          type:
            - string
            - 'null'
          format: uuid
        total_calls:
          type: integer
          minimum: 0
        total_errors:
          type: integer
          minimum: 0
        error_rate:
          type:
            - number
            - 'null'
