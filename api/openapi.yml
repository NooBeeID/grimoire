components:
  schemas:
    Error:
      type: object
      description: Format error seragam untuk semua error /api.
      required:
        - error
        - trace_id
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
            details:
              description: Data tambahan yang aman ditampilkan (objek, array), atau null.
        trace_id:
          type: string
    AuditEntrySummary:
      type: object
      required:
        - id
        - occurred_at
        - actor_type
        - actor_id
        - actor_label
        - project_id
        - project_label
        - action
        - target_type
        - target
        - status
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor_type:
          $ref: '#/components/schemas/ActorType'
        actor_id:
          type:
            - string
            - 'null'
          format: uuid
        actor_label:
          type: string
        project_id:
          type:
            - string
            - 'null'
          format: uuid
        project_label:
          type:
            - string
            - 'null'
        action:
          type: string
          example: mcp.read_file
        target_type:
          type:
            - string
            - 'null'
        target:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/AuditStatus'
    AuditEntryList:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntrySummary'
        next_cursor:
          type:
            - string
            - 'null'
          description: Null pada halaman terakhir.
    AuditEntryDetail:
      allOf:
        - $ref: '#/components/schemas/AuditEntrySummary'
        - type: object
          required:
            - args
            - result
            - ip
            - user_agent
            - trace_id
          properties:
            args:
              type: object
              additionalProperties: true
              description: Argumen yang sudah disanitasi.
            result:
              type: object
              additionalProperties: true
            ip:
              type:
                - string
                - 'null'
            user_agent:
              type:
                - string
                - 'null'
            trace_id:
              type:
                - string
                - 'null'
    Me:
      type: object
      required:
        - id
        - email
        - name
        - role
        - must_change_password
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        must_change_password:
          type: boolean
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
        - is_active
        - must_change_password
        - created_at
        - created_by
        - created_by_label
        - updated_at
        - last_login_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          type:
            - string
            - 'null'
          format: uuid
        created_by_label:
          type:
            - string
            - 'null'
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type:
            - string
            - 'null'
          format: date-time
    UserList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    UserWithTempPassword:
      type: object
      required:
        - user
        - temporary_password
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporary_password:
          type:
            - string
            - 'null'
          description: Hanya terisi bila dibangkitkan server; tampil sekali dan tidak dapat diambil lagi.
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
    ActorType:
      type: string
      enum:
        - user
        - api_key
        - anonymous
        - system
    AuditStatus:
      type: string
      enum:
        - ok
        - error
        - denied
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 256
          writeOnly: true
    Role:
      type: string
      enum:
        - super_admin
        - developer
    LoginResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/Me'
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          maxLength: 256
          writeOnly: true
        new_password:
          type: string
          maxLength: 256
          writeOnly: true
          description: Minimal PASSWORD_MIN_LENGTH karakter, beda dari password lama dan dari email.
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - name
        - role
      properties:
        email:
          type: string
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          maxLength: 256
          writeOnly: true
          description: Opsional; bila kosong server membangkitkan password sementara.
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          maxLength: 256
          writeOnly: true
          description: Opsional; bila kosong server membangkitkan password sementara.
  responses:
    BadRequest:
      description: Permintaan tidak valid (INVALID_ARGUMENT)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_ARGUMENT
              message: permintaan tidak valid
              details:
                fields:
                  name: wajib diisi
            trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
    Unauthorized:
      description: Perlu login (UNAUTHORIZED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: perlu login
              details: null
            trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
    Forbidden:
      description: Akses ditolak (FORBIDDEN) atau header CSRF hilang (CSRF_REQUIRED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: akses ditolak
                  details: null
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
            csrf:
              value:
                error:
                  code: CSRF_REQUIRED
                  message: header X-Requested-With wajib untuk request mutasi
                  details: null
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
    NotFound:
      description: Resource tidak ditemukan (NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: resource tidak ditemukan
              details: null
            trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
    Conflict:
      description: Konflik state (CONFLICT)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Ukuran body melebihi batas (PAYLOAD_TOO_LARGE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: ukuran body melebihi batas
              details:
                limit_bytes: 1048576
            trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
    RateLimited:
      description: Terlalu banyak permintaan (RATE_LIMITED)
      headers:
        Retry-After:
          description: Detik sebelum boleh mencoba lagi
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: terlalu banyak permintaan, coba lagi nanti
              details:
                retry_after_seconds: 3
            trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
    Internal:
      description: Kesalahan internal (INTERNAL)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL
              message: terjadi kesalahan internal
              details: null
            trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
    ForbiddenAdmin:
      description: |
        Akses ditolak. Kode: FORBIDDEN (bukan super_admin, atau SELF_ACTION_FORBIDDEN via details.reason), PASSWORD_CHANGE_REQUIRED (user wajib ganti password), CSRF_REQUIRED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: akses ditolak
                  details: null
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
            password_change_required:
              value:
                error:
                  code: PASSWORD_CHANGE_REQUIRED
                  message: password wajib diganti sebelum melanjutkan
                  details: null
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
            self_action:
              value:
                error:
                  code: FORBIDDEN
                  message: tidak boleh menonaktifkan atau menurunkan role akun sendiri
                  details:
                    reason: SELF_ACTION_FORBIDDEN
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
            csrf:
              value:
                error:
                  code: CSRF_REQUIRED
                  message: header X-Requested-With wajib untuk request mutasi
                  details: null
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
    AdminConflict:
      description: Konflik (CONFLICT), mis. email sudah terdaftar atau super admin aktif terakhir
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            last_super_admin:
              value:
                error:
                  code: CONFLICT
                  message: minimal harus ada satu super admin aktif
                  details:
                    reason: LAST_SUPER_ADMIN
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
            email_taken:
              value:
                error:
                  code: CONFLICT
                  message: email sudah terdaftar
                  details: null
                trace_id: 4f6c2a1e-8d3b-4c55-9a1f-2b7e0d9c1a33
  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: Wajib untuk request mutasi (nilai grimoire); tanpa itu 403 CSRF_REQUIRED.
      schema:
        type: string
        example: grimoire
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
