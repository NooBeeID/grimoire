      description: |
        Membuat akun developer (nama default dari bagian lokal email bila name kosong), menerbitkan password sementara, dan mengirimnya lewat email dalam satu langkah. Email dinormalisasi lowercase. Bila email terkirim, respons tidak memuat credentials. Bila tidak terkirim (email_status failed atau not_configured) respons memuat credentials SEKALI dengan header Cache-Control no-store; kredensial itu tidak dapat diambil lagi. Akun yang masih menunggu (belum diterima) diterbitkan ulang (created=false) dan dihitung sebagai kirim ulang. 409 ALREADY_REGISTERED (details.reason registered, inactive, atau not_developer) bila email sudah terdaftar. Kuota undangan per pengundang 20 per jam (429 scope invite).
