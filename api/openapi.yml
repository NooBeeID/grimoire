        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor_type:
          $ref: '#/components/schemas/ActorType'
        actor_id:
          type:
            - string
            - 'null'
          format: uuid
        actor_label:
          type: string
        project_id:
          type:
            - string
            - 'null'
          format: uuid
        project_label:
          type:
            - string
            - 'null'
        action:
          type: string
          example: mcp.read_file
        target_type:
          type:
            - string
            - 'null'
        target:
          type:
            - string
            - 'null'
