            Salah satu dari HOST_NOT_ALLOWED, CREDENTIAL_MISSING, CREDENTIAL_UNREADABLE (details memuat settings_path /settings#token-git), GIT_TOKEN_REJECTED, GIT_ACCESS_DENIED, SYNC_LIMIT_EXCEEDED (details: files, max_files, known_bytes, max_total_bytes), GIT_TREE_TOO_LARGE.
