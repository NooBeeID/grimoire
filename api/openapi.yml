  /api/projects/{projectID}/git-sync/run:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: runsync
      tags:
        - project-git-sync
      summary: Sync file dari repo Git
      description: |
        Anggota (owner/member) dan super_admin. Menarik file dari repo GitHub/GitLab memakai token milik pemanggil, lalu menulisnya ke knowledge atau API spec lewat jalur upload yang sama. File bernama sama ditimpa; file yang tidak ada di repo tidak dihapus. Satu sync per (project, kind) pada satu waktu. Semua file diambil dulu sebelum ada yang ditulis, sehingga kegagalan provider tidak meninggalkan project setengah tertimpa. Batas waktu GIT_SYNC_TIMEOUT (default 15 menit). Request ke provider dijeda minimal GIT_SYNC_REQUEST_INTERVAL (default 500ms); bila jatah rate limit provider habis, server menunggu sampai reset (maksimal GIT_SYNC_MAX_WAIT per tunggu dan GIT_SYNC_MAX_TOTAL_WAIT per sync), lewat batas itu dijawab RATE_LIMITED. Sync berjalan di server meski koneksi klien putus.

        Negosiasi `Accept`: bila memuat `text/event-stream`, respons 200 berupa stream SSE berisi progress per file; selain itu respons JSON seperti sebelumnya. Error yang terjadi sebelum stream dimulai (400/403/404/409/422/503) selalu respons JSON biasa, juga pada jalur SSE. Body maksimal 16 KiB; field tak dikenal ditolak 400. Bila url memuat branch/folder (…/tree/{branch}/{folder}) dan field `branch`/`folder` kosong, nilai dari url dipakai. `target_prefix` hanya untuk kind knowledge dan diabaikan untuk api_spec. Status laporan: success, partial (ada skipped/rejected), failed.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - name: Accept
          in: header
          required: false
          description: Isi `text/event-stream` untuk menerima progress lewat SSE; selain itu respons JSON.
          schema:
            type: string
            example: text/event-stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunGitSyncRequest'
            examples:
              knowledge:
                value:
                  kind: knowledge
                  url: https://github.com/noobee/grimoire-docs/tree/main/docs
                  branch: ''
                  folder: ''
                  target_prefix: ''
              apiSpec:
                value:
                  kind: api_spec
                  url: https://github.com/noobee/grimoire-docs
                  branch: main
                  folder: api/openapi
      responses:
        '200':
          description: Sync selesai (success atau partial). Detail per file ada di report.items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunGitSyncResponse'
              example:
                report:
                  status: partial
                  summary:
                    created: 1
                    updated: 0
                    unchanged: 0
                    skipped: 0
                    rejected: 1
                  items:
                    - repo_path: api/openapi/billing.yaml
                      target: billing
                      status: created
                      reason_code: ''
                      reason: ''
                      issues: []
                      openapi_version: 3.0.3
                      title: Billing API
                      endpoint_count: 14
                    - repo_path: api/openapi/payments.json
                      target: payments
                      status: rejected
                      reason_code: INVALID_SPEC
                      reason: $ref eksternal tidak didukung
                      issues:
                        - code: EXTERNAL_REF
                          message: $ref eksternal tidak didukung
                          pointer: '#/paths/~1charges/get'
                          line: 0
                  truncated: false
                  error_code: ''
                  error_message: ''
                config:
                  provider: github
                  host: github.com
                  repo_url: https://github.com/noobee/grimoire-docs/tree/main/api/openapi
                  repo_path: noobee/grimoire-docs
                  branch: main
                  folder: api/openapi
                  target_prefix: ''
                  last_status: partial
                  last_synced_at: '2026-10-22T14:05:00Z'
                  last_synced_by:
                    id: 0192f5a0-aaaa-7aaa-8bbb-00000000000a
                    label: Rina
                  last_result: null
            text/event-stream:
              schema:
                type: string
                description: |
                  Stream SSE. Format tiap event `event: <nama>\ndata: <json satu baris>\n\n`; baris `: ping` dikirim tiap 15 detik sebagai heartbeat. Urutan: `start`, `progress` (satu per file), `waiting` (bila menunggu rate limit), `saving`, lalu `done` atau `error` sebagai event terakhir. Data per event mengikuti skema GitSyncEventStart, GitSyncEventProgress, GitSyncEventWaiting, GitSyncEventSaving, GitSyncEventDone (RunGitSyncResponse), dan GitSyncEventError. Event tidak memuat token maupun isi file.
              example: |
                event: start
                data: {"total":3}

                event: progress
                data: {"done":1,"total":3,"path":"docs/auth/login-flow.md"}

                event: waiting
                data: {"retry_after_seconds":38,"reason":"rate_limit_exhausted"}

                : ping

                event: progress
                data: {"done":2,"total":3,"path":"docs/auth/session-cookie.md"}

                event: progress
                data: {"done":3,"total":3,"path":"docs/onboarding/setup-local.md"}

                event: saving
                data: {}

                event: done
                data: {"report":{"status":"success","summary":{"created":3,"updated":0,"unchanged":0,"skipped":0,"rejected":0},"items":[],"truncated":false,"error_code":"","error_message":""},"config":{"provider":"github","host":"github.com","repo_url":"https://github.com/noobee/grimoire-docs","repo_path":"noobee/grimoire-docs","branch":"main","folder":"docs","target_prefix":"","last_status":"success","last_synced_at":"2026-10-22T08:14:03Z","last_synced_by":{"id":"0192f5a0-aaaa-7aaa-8bbb-00000000000a","label":"Rina"},"last_result":null}}
        '400':
          description: |
            INVALID_ARGUMENT (kind, body, atau target_prefix tidak valid) atau INVALID_REPO_URL (url/branch/folder tidak valid; details.field menyebut field).
          content:
            application/json:
