    ApiSpecEnvelope:
      type: object
      additionalProperties: false
      required:
        - spec
      properties:
        spec:
          $ref: '#/components/schemas/ApiSpec'
    ApiSpecEndpoint:
      type: object
      additionalProperties: false
      required:
        - method
        - path
        - operation_id
        - summary
        - tags
        - deprecated
      properties:
        method:
          type: string
          example: GET
        path:
          type: string
          example: /payments
        operation_id:
          type:
            - string
            - 'null'
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        deprecated:
          type: boolean
    ApiSpecDetail:
      type: object
      additionalProperties: false
      required:
        - spec
        - endpoints
        - document
      properties:
        spec:
          $ref: '#/components/schemas/ApiSpec'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ApiSpecEndpoint'
        document:
          type: object
          additionalProperties: true
          description: Dokumen spec sebagai JSON apa adanya (openapi untuk 3.x, swagger "2.0" untuk Swagger 2.0); $ref internal dipertahankan, urutan kunci mengikuti file asli.
    RenameApiSpecRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          pattern: ^[a-z0-9._-]{1,80}$
    ApiSpecUploadRequest:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          minItems: 1
          items:
            type: string
            format: binary
          description: Satu atau banyak file; nama file (dengan path folder bila ada) menjadi source_path.
        name:
          type: string
          pattern: ^[a-z0-9._-]{1,80}$
          description: Opsional; hanya boleh dipakai saat tepat satu file. Default nama file tanpa ekstensi.
