        pattern: ^[a-z0-9._-]{1,80}$
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GitProvider'
    Kind:
      name: kind
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/GitSyncKind'
