        - code
        - message
        - pointer
        - line
      properties:
        code:
          type: string
          example: EXTERNAL_REF
        message:
          type: string
        pointer:
          type:
            - string
            - 'null'
          description: JSON pointer lokasi masalah
        line:
          type:
            - integer
            - 'null'
    ApiSpecFileResult:
      type: object
      additionalProperties: false
      required:
        - file
        - source_path
        - name
        - status
        - reason_code
        - reason
        - issues
        - openapi_version
        - title
        - api_version
        - endpoint_count
      properties:
        file:
          type: string
        source_path:
          type:
            - string
            - 'null'
        name:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - created
            - updated
            - unchanged
            - valid
            - skipped
            - rejected
          description: created/updated/unchanged hanya pada upload; valid hanya pada validate.
        reason_code:
          type:
            - string
            - 'null'
          description: |
            Mis. INVALID_SPEC, NOT_SPEC_FILE, FILE_TOO_LARGE, DUPLICATE_NAME_IN_UPLOAD, SPEC_LIMIT_REACHED.
        reason:
          type:
            - string
            - 'null'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ApiSpecIssue'
        openapi_version:
          type:
            - string
            - 'null'
          description: Versi dokumen; nomor openapi untuk 3.x, atau "2.0" untuk Swagger 2.0.
        title:
          type:
            - string
            - 'null'
        api_version:
          type:
            - string
            - 'null'
        endpoint_count:
          type:
            - integer
            - 'null'
    ApiSpecUploadResult:
      type: object
      additionalProperties: false
      required:
