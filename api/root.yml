openapi: 3.1.0
info:
  title: NooBee Grimoire API
  version: 0.1.0
servers:
  - url: /
paths:
  /healthz:
    $ref: ./modules/infra/foundation.yml#/paths/~1healthz
  /readyz:
    $ref: ./modules/infra/foundation.yml#/paths/~1readyz
  /api/audit-log:
    $ref: ./modules/core/audit-log.yml#/paths/~1api~1audit-log
  /api/audit-log/{id}:
    $ref: ./modules/core/audit-log.yml#/paths/~1api~1audit-log~1{id}
components:
  schemas:
    Error:
      $ref: ./modules/infra/foundation.yml#/components/schemas/Error
    AuditEntrySummary:
      $ref: ./modules/core/audit-log.yml#/components/schemas/AuditEntrySummary
    AuditEntryList:
      $ref: ./modules/core/audit-log.yml#/components/schemas/AuditEntryList
    AuditEntryDetail:
      $ref: ./modules/core/audit-log.yml#/components/schemas/AuditEntryDetail
  responses:
    BadRequest:
      $ref: ./modules/infra/foundation.yml#/components/responses/BadRequest
    Unauthorized:
      $ref: ./modules/infra/foundation.yml#/components/responses/Unauthorized
    Forbidden:
      $ref: ./modules/infra/foundation.yml#/components/responses/Forbidden
    NotFound:
      $ref: ./modules/infra/foundation.yml#/components/responses/NotFound
    Conflict:
      $ref: ./modules/infra/foundation.yml#/components/responses/Conflict
    PayloadTooLarge:
      $ref: ./modules/infra/foundation.yml#/components/responses/PayloadTooLarge
    RateLimited:
      $ref: ./modules/infra/foundation.yml#/components/responses/RateLimited
    Internal:
      $ref: ./modules/infra/foundation.yml#/components/responses/Internal
