services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: grimoire
      POSTGRES_PASSWORD: grimoire
      POSTGRES_DB: grimoire
    ports:
      - "5433:5432"
    volumes:
      - grimoire_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grimoire -d grimoire"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backend dev berjalan di host: SMTP localhost:1025, UI http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  grimoire_pgdata:
